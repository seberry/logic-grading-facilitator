    tags:
      - "s4"
      - "r4"
      - "baseline_typeset"
    source: "working/modal-proof-tex-suite"
    oracle_kind: "current_debug_output"
    notes: "S4 typeset case used to validate passing system-specific checker config."

  - id: "modal_s5_typeset_example"
    domain: "modal"
    kind: "typeset"
    image_path: "working/modal-proof-tex-suite/s5_r5_example.png"
    expected_structure_path: "working/modal-proof-tex-suite/ocr_runs/s5_r5_example/final_structure.json"
    tags:
      - "s5"
      - "r5"
      - "baseline_typeset"
