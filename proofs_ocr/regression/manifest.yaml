    image_path: "working/modal-proof-zone-split-handwritten/crop_ROOT.jpg"
    expected_structure_path: "working/modal-proof-zone-split-handwritten/final_structure.json"
    tags:
      - "handwritten"
      - "repo_local_crop"
      - "known_hard_case"
    source: "working/modal-proof-zone-split-handwritten"
    oracle_kind: "provisional_debug_output"
    notes: "Repo-local handwritten modal crop with saved final structure and verifier artifacts."

