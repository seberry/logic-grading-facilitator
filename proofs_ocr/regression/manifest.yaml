suite:
  name: "proofs_ocr_regression"
  status: "initial scaffold"
  purpose: >
    Canonical list of proof OCR cases for the next clean pipeline. This manifest
    should become the source of truth for typeset and handwritten regression runs.
  notes:
    - "Current cases still live in older working/ and data/ locations."
    - "Populate exact paths as the suite is consolidated."

schema:
  required_fields:
    - "id"
    - "domain"
    - "kind"
    - "image_path"
    - "expected_structure_path"
  optional_fields:
    - "tags"
    - "notes"
    - "source"
    - "oracle_kind"

cases:
  - id: "modal_k_typeset_mixed_subproofs"
    domain: "modal"
    kind: "typeset"
    image_path: "working/modal-proof-tex-suite/k_mixed_subproofs.png"
    expected_structure_path: "working/modal-proof-tex-suite/ocr_runs/k_mixed_subproofs/final_structure.json"
    tags:
      - "nested_subproofs"
      - "strict_open"
      - "baseline_typeset"
    source: "working/modal-proof-tex-suite"
    oracle_kind: "current_debug_output"
    notes: "K proof with an ordinary subproof containing a strict subproof, ending in □A → □B."

  - id: "modal_k_typeset_invalid_nested_boxe"
    domain: "modal"
    kind: "typeset"
    image_path: "working/modal-proof-tex-suite/k_invalid_nested_boxe.png"
    expected_structure_path: "working/modal-proof-tex-suite/ocr_runs/k_invalid_nested_boxe/final_structure.json"
    tags:
      - "nested_subproofs"
      - "strict_open"
      - "boundary_case"
    source: "working/modal-proof-tex-suite"
    oracle_kind: "current_debug_output"
    notes: "Typeset K case used for invalid nested box debugging."

  - id: "modal_s4_typeset_r4_corrected"
    domain: "modal"
    kind: "typeset"
    image_path: "working/modal-proof-tex-suite/s4_r4_corrected.png"
