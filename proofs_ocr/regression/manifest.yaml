suite:
  name: "proofs_ocr_regression"
  status: "curated modal gold fixtures selected"
  purpose: >
    Canonical list of proof OCR cases for the clean proofs_ocr pipelines. This
    manifest is the working source of truth for modal typeset and handwritten
    regression runs.
  notes:
    - "The active modal manifest now tracks a small curated gold set."
    - "Typeset gold structures come from source.tex."
    - "Handwritten gold structures are curated from the image as written; semantic caveats live in sidecar notes."

schema:
  required_fields:
    - "id"
    - "domain"
    - "kind"
    - "image_path"
    - "expected_structure_path"
  optional_fields:
    - "tags"
    - "notes"
    - "source"
    - "oracle_kind"
    - "semantic_notes_path"

cases:
  - id: "modal_k_typeset_mixed_subproofs"
    domain: "modal"
    kind: "typeset"
    image_path: "proofs_ocr/regression/fixtures/modal/typeset/k_mixed_subproofs/image.png"
    expected_structure_path: "proofs_ocr/regression/fixtures/modal/typeset/k_mixed_subproofs/expected_structure.json"
    tags:
      - "nested_subproofs"
      - "strict_open"
      - "baseline_typeset"
    source: "proofs_ocr/regression/fixtures/modal/typeset/k_mixed_subproofs/source.tex"
    oracle_kind: "gold_from_source_tex"
    notes: "Curated K typeset gold case with nested subproofs and a strict opener."

  - id: "modal_s4_typeset_r4_corrected"
    domain: "modal"
    kind: "typeset"
    image_path: "proofs_ocr/regression/fixtures/modal/typeset/s4_r4_corrected/image.png"
    expected_structure_path: "proofs_ocr/regression/fixtures/modal/typeset/s4_r4_corrected/expected_structure.json"
    tags:
      - "s4"
      - "r4"
      - "baseline_typeset"
    source: "proofs_ocr/regression/fixtures/modal/typeset/s4_r4_corrected/source.tex"
    oracle_kind: "gold_from_source_tex"
    notes: "Curated S4 typeset gold case."

  - id: "modal_s5_typeset_example"
    domain: "modal"
    kind: "typeset"
    image_path: "proofs_ocr/regression/fixtures/modal/typeset/s5_r5_example/image.png"
    expected_structure_path: "proofs_ocr/regression/fixtures/modal/typeset/s5_r5_example/expected_structure.json"
    tags:
      - "s5"
      - "r5"
      - "baseline_typeset"
    source: "proofs_ocr/regression/fixtures/modal/typeset/s5_r5_example/source.tex"
    oracle_kind: "gold_from_source_tex"
    notes: "Curated S5 typeset gold case."

  - id: "modal_handwritten_user_box_q"
    domain: "modal"
    kind: "handwritten"
    image_path: "proofs_ocr/regression/fixtures/modal/handwritten/user_box_q/image.jpg"
    expected_structure_path: "proofs_ocr/regression/fixtures/modal/handwritten/user_box_q/expected_structure.json"
    semantic_notes_path: "proofs_ocr/regression/fixtures/modal/handwritten/user_box_q/semantic_notes.yaml"
    tags:
      - "handwritten"
      - "user_provided"
      - "box_intro"
    source: "proofs_ocr/regression/fixtures/modal/handwritten/user_box_q"
    oracle_kind: "gold_curated_from_image"
    notes: "Curated handwritten gold case ending with □Q."

  - id: "modal_handwritten_user_negated_modal_conjunction"
    domain: "modal"
    kind: "handwritten"
    image_path: "proofs_ocr/regression/fixtures/modal/handwritten/user_negated_modal_conjunction/image.jpg"
    expected_structure_path: "proofs_ocr/regression/fixtures/modal/handwritten/user_negated_modal_conjunction/expected_structure.json"
    semantic_notes_path: "proofs_ocr/regression/fixtures/modal/handwritten/user_negated_modal_conjunction/semantic_notes.yaml"
    tags:
      - "handwritten"
      - "user_provided"
      - "derived_rule_note"
      - "semantic_note"
    source: "proofs_ocr/regression/fixtures/modal/handwritten/user_negated_modal_conjunction"
    oracle_kind: "gold_curated_from_image"
    notes: "Curated handwritten gold case with explicit semantic notes for lines 4 and 7."

  # ── TFL Handwritten Fitch Proofs (instructor-authored, no FERPA) ──

  - id: "tfl_handwritten_q3_P_and_Q_imp_R"
    domain: "tfl"
    kind: "handwritten"
    image_path: "proofs_ocr/regression/fixtures/tfl/handwritten/q3_P_and_Q_imp_R/image.png"
    expected_structure_path: "proofs_ocr/regression/fixtures/tfl/handwritten/q3_P_and_Q_imp_R/expected_structure.json"
    tags:
      - "handwritten"
      - "instructor_authored"
      - "tfl"
      - "implication_intro"
      - "valid_proof"
    source: "proofs_ocr/regression/fixtures/tfl/handwritten/q3_P_and_Q_imp_R"
    oracle_kind: "gold_curated_from_image"
    notes: "Valid TFL proof: (P∧Q)→R, P→Q ⊢ (P∧S)→R. Single subproof with →I."

  - id: "tfl_handwritten_q4_N_or_K_and_W"
    domain: "tfl"
    kind: "handwritten"
    image_path: "proofs_ocr/regression/fixtures/tfl/handwritten/q4_N_or_K_and_W/image.png"
    expected_structure_path: "proofs_ocr/regression/fixtures/tfl/handwritten/q4_N_or_K_and_W/expected_structure.json"
    semantic_notes_path: "proofs_ocr/regression/fixtures/tfl/handwritten/q4_N_or_K_and_W/semantic_notes.yaml"
    tags:
      - "handwritten"
      - "instructor_authored"
      - "tfl"
      - "disjunction_elim"
      - "biconditional_elim"
      - "valid_proof"
    source: "proofs_ocr/regression/fixtures/tfl/handwritten/q4_N_or_K_and_W"
    oracle_kind: "gold_curated_from_image"
    notes: "Valid TFL proof: N∨(K∧W), N↔W ⊢ W. ∨E with two subproofs. Line 4 has handwritten '↔F' normalized to '↔E'."

  - id: "tfl_handwritten_q5_P_or_K_biconditional"
    domain: "tfl"
    kind: "handwritten"
    image_path: "proofs_ocr/regression/fixtures/tfl/handwritten/q5_P_or_K_biconditional/image.png"
    expected_structure_path: "proofs_ocr/regression/fixtures/tfl/handwritten/q5_P_or_K_biconditional/expected_structure.json"
    semantic_notes_path: "proofs_ocr/regression/fixtures/tfl/handwritten/q5_P_or_K_biconditional/semantic_notes.yaml"
    tags:
      - "handwritten"
      - "instructor_authored"
      - "tfl"
      - "biconditional_elim"
      - "intentional_error"
      - "self_citation"
    source: "proofs_ocr/regression/fixtures/tfl/handwritten/q5_P_or_K_biconditional"
    oracle_kind: "gold_curated_from_image"
    notes: "TFL proof with intentional student error: line 4 '↔E 1,4' self-cites. No subproofs. Verifier should flag the error."

  - id: "tfl_handwritten_q6_S_iff_W"
    domain: "tfl"
    kind: "handwritten"
    image_path: "proofs_ocr/regression/fixtures/tfl/handwritten/q6_S_iff_W/image.png"
    expected_structure_path: "proofs_ocr/regression/fixtures/tfl/handwritten/q6_S_iff_W/expected_structure.json"
    semantic_notes_path: "proofs_ocr/regression/fixtures/tfl/handwritten/q6_S_iff_W/semantic_notes.yaml"
    tags:
      - "handwritten"
      - "instructor_authored"
      - "tfl"
      - "biconditional_intro"
      - "intentional_error"
      - "invalid_rule_application"
    source: "proofs_ocr/regression/fixtures/tfl/handwritten/q6_S_iff_W"
    oracle_kind: "gold_curated_from_image"
    notes: "TFL proof with intentional errors on lines 6 and 10: ∧I citations don't match the claimed formula. ↔I with two subproofs."
