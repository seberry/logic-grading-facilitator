suite:
  name: "proofs_ocr_regression"
  status: "initial scaffold"
  purpose: >
    Canonical list of proof OCR cases for the next clean pipeline. This manifest
    should become the source of truth for typeset and handwritten regression runs.
  notes:
    - "Current cases still live in older working/ and data/ locations."
    - "Populate exact paths as the suite is consolidated."

schema:
  required_fields:
    - "id"
    - "domain"
    - "kind"
    - "image_path"
    - "expected_structure_path"
  optional_fields:
    - "tags"
    - "notes"
    - "source"
    - "oracle_kind"

cases:
  - id: "modal_k_typeset_mixed_subproofs"
    domain: "modal"
    kind: "typeset"
    image_path: "proofs_ocr/regression/fixtures/modal/typeset/k_mixed_subproofs/image.png"
    expected_structure_path: "proofs_ocr/regression/fixtures/modal/typeset/k_mixed_subproofs/expected_structure.json"
    tags:
      - "nested_subproofs"
      - "strict_open"
      - "baseline_typeset"
    source: "proofs_ocr/regression/fixtures/modal/typeset/k_mixed_subproofs/source.tex"
    oracle_kind: "current_debug_output"
    notes: "K proof with an ordinary subproof containing a strict subproof, ending in □A → □B."

  - id: "modal_k_typeset_invalid_nested_boxe"
    domain: "modal"
    kind: "typeset"
    image_path: "proofs_ocr/regression/fixtures/modal/typeset/k_invalid_nested_boxe/image.png"
    expected_structure_path: "proofs_ocr/regression/fixtures/modal/typeset/k_invalid_nested_boxe/expected_structure.json"
    tags:
      - "nested_subproofs"
      - "strict_open"
      - "boundary_case"
