project_meta:
  name: "Proof OCR"
  status: "modal baseline refactor running end-to-end"
  purpose: >
    Shared guidance for future LLM-assisted work on proof OCR. This document
    describes the current clean pipeline boundaries, what is already live, and
    what should happen next without collapsing back into giant script-shaped
    implementations.

scope:
  active_reference_implementations:
    - "scripts/debug_fitch_ocr.py"
    - "scripts/debug_modal_proof_ocr.py"
  active_new_pipeline:
    - "proofs_ocr/pipelines/modal_v2.py"
  new_workspace:
    - "proofs_ocr/"
  non_goals:
    - "Do not rewrite the existing TFL OCR path in-place."
    - "Do not import shared logic from script modules as the long-term design."
    - "Do not restore old modal heuristics as the default architecture."

current_repo_state:
  committed_refactor_base:
    - "Shared Fitch-style mechanics now live in proofs_ocr/common."
    - "Committed modal fixtures live under proofs_ocr/regression/fixtures/modal."
    - "The modal_v2 baseline runs end to end and writes debug artifacts."
    - "/debug/modal-proof can run either the legacy modal script path or modal_v2 baseline."
  active_code_paths:
    - "scripts/debug_fitch_ocr.py remains the stable TFL reference implementation."
    - "scripts/debug_modal_proof_ocr.py remains the richer modal reference implementation."
    - "proofs_ocr/pipelines/modal_v2.py is the new minimal recursive modal baseline."
  current_module_split:
    - "proofs_ocr/pipelines/modal_v2_core.py owns recursive baseline orchestration."
    - "proofs_ocr/pipelines/modal_v2_runtime.py owns the line-reader / LM Studio adapter."
    - "proofs_ocr/pipelines/modal_v2_debug.py owns artifact writing and debug-state assembly."
    - "proofs_ocr/pipelines/modal_v2.py is the public facade / CLI."
  known_workspace_confusions:
    - "Expected structure files in the modal regression fixtures are regression targets, not uniformly gold truth."
    - "Handwritten expected structures are especially provisional."
    - "Legacy script artifacts still exist in the debug viewer for comparison; they should not be mistaken for the selected modal_v2 path."

core_workflow:
  summary: >
    The durable idea is recursive decomposition of Fitch-style proofs. Keep that
    structure legible in code and in debug artifacts. Prompt experiments and
    repair heuristics should stay secondary.
  steps:
    - "Detect vertical scope bars in a tightly cropped proof image."
    - "Build a nested subproof tree from those bar regions."
    - "OCR child scopes first so each subtree is resolved bottom-up."
    - "Mask each resolved child with a synthetic placeholder token inside its parent."
    - "Segment rows and OCR the current node one line at a time."
    - "Stitch placeholders back into a nested proof structure and normalize output."

module_boundaries:
  common:
    owns:
      - "bar detection and region geometry"
      - "subproof tree construction"
      - "placeholder token masking"
      - "row-band detection"
      - "stitch / renumber utilities"
      - "artifact-writing helpers"
    should_not_own:
      - "modal-only repair heuristics"
      - "prompt wording tied to one logic domain"
      - "legacy-script adapters"
  domains:
    owns:
      - "prompt text"
      - "formula normalization"
      - "justification normalization"
      - "final line-resolution helpers"
      - "domain-specific heuristics when explicitly enabled"
  pipelines:
    owns:
      - "top-level orchestration for a concrete experiment path"
      - "runtime adapters for a chosen OCR backend"
      - "debug-state assembly for that path"

modal_v2_baseline:
  default_character:
    - "Minimal recursive baseline."
    - "Old-script-free by default."
    - "Explicit feature flags reserved for future optional layers."
  reserved_feature_flags:
    - "enable_strict_opener_classifier"
    - "enable_short_formula_reread"
    - "enable_retry_on_suspicious_line"
    - "enable_unary_verifier"
    - "enable_boundary_repair"
  current_debug_surface:
    - "CLI entry point: python -m proofs_ocr.pipelines.modal_v2 ..."
    - "Debug-state harness writes source image, debug bars, node crops, row overlays, per-line crops, and final_structure_baseline.json."
    - "/debug/modal-proof exposes a pipeline toggle so modal_v2 artifacts can be inspected beside the proof image."

guardrails:
  - "Treat existing debug scripts as reference implementations, not shared libraries."
  - "Prefer moving a stable primitive into proofs_ocr over importing it from a script."
  - "Keep shared proof mechanics separate from modal-specific cleanup."
  - "Keep optional legacy behavior behind explicit flags or adapters."
  - "If a file grows large enough that a human has to scroll repeatedly to keep the mental model intact, split it before adding more behavior."
  - "Raise the possibility of an early split once one file starts carrying multiple concerns, even if the code still technically works."
  - "If a behavior change is intentional, record which regression cases improved and what tradeoff appeared."

near_term_plan:
  - "Use the modal_v2 baseline and debug viewer artifacts to diagnose real fixture failures."
  - "Prioritize bar-geometry and masking fixes before adding more OCR heuristics."
  - "Keep TFL OCR unchanged while the modal baseline matures."
  - "Only add old-script complications later as explicit opt-in layers."

regression_expectations:
  current_seed_cases:
    - "proofs_ocr/regression/manifest.yaml seeds four modal typeset fixtures and two handwritten modal fixtures."
    - "The expected_structure files are useful regression targets, but not a perfect correctness oracle."
  known_gap:
    - "Longer-term, the suite should distinguish baseline OCR output from gold/correct structure."
  quality_bar: >
    The immediate goal is not zero-touch OCR. The goal is to make recursive
    proof structure reliable enough that human correction becomes smaller,
    clearer, and faster.

handoff_notes:
  when_editing_proofs_ocr:
    - "Explain whether a change belongs in common, domains, or pipelines."
    - "Prefer structural clarity over adding another hidden heuristic."
    - "Keep the recursive decomposition workflow visible in code."
  when_restarting_after_context_loss:
    - "Read docs/PROOF_OCR_REFACTOR_STATUS.md first."
    - "Then inspect proofs_ocr/regression/manifest.yaml."
    - "Use /debug/modal-proof with the modal_v2 baseline toggle to inspect real artifact output."
