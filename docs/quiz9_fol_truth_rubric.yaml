# Reviewable example for the blank Quiz 9 PDF. Copy into a new, private quiz
# preparation session only after the instructor verifies points and prompts.
quiz_id: quiz9_monadic_fol_truth
fol_truth_assistance:
  schema: 1
  assessment: quiz9_monadic_fol_truth
  scoring:
    Q1: {truth: 2}
    Q2: {truth: 1, object: 1, blank_na_credit: false}
