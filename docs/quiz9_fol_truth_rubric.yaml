    Q7: {truth: 1}
problems:
  - id: Q1
    label: "Truth value 1"
    points: 2
    variants:
      A: {prompt: "¬P(c) ∨ Q(c)"}
      B: {prompt: "¬P(c) ∨ Q(c)"}
      C: {prompt: "¬P(c) ∨ Q(c)"}
  - id: Q2
    label: "Truth value and witness 2"
    points: 2
    variants:
      A: {prompt: "∃x (P(x) ∧ Q(x) ∧ R(x)); witness or N/A"}
      B: {prompt: "∃x (P(x) ∧ Q(x) ∧ R(x)); witness or N/A"}
      C: {prompt: "∃x (P(x) ∧ Q(x) ∧ R(x)); witness or N/A"}
  - id: Q3
    label: "Truth value and witness 3"
    points: 2
    variants:
      A: {prompt: "∃x (P(x) ∧ ¬Q(x)); witness or N/A"}
      B: {prompt: "∃x (P(x) ∧ ¬Q(x)); witness or N/A"}
      C: {prompt: "∃x (P(x) ∧ ¬Q(x)); witness or N/A"}
  - id: Q4
    label: "Truth value and counterexample 4"
    points: 2
    variants:
      A: {prompt: "∀x (P(x) → (Q(x) ∨ R(x))); counterexample or N/A"}
      B: {prompt: "∀x (P(x) → (Q(x) ∨ R(x))); counterexample or N/A"}
      C: {prompt: "∀x (P(x) → (Q(x) ∨ R(x))); counterexample or N/A"}
  - id: Q5
    label: "Truth value and counterexample 5"
    points: 2
    variants:
      A: {prompt: "∀x (P(x) ∨ Q(x)); counterexample or N/A"}
      B: {prompt: "∀x (P(x) ∨ Q(x)); counterexample or N/A"}
      C: {prompt: "∀x (P(x) ∨ Q(x)); counterexample or N/A"}
  - id: Q6
    label: "Extra credit: separate existentials"
    points: 1
    extra_credit: true
    variants:
      A: {prompt: "(∃x P(x)) ∧ (∃x Q(x))"}
      B: {prompt: "(∃x P(x)) ∧ (∃x Q(x))"}
      C: {prompt: "(∃x P(x)) ∧ (∃x Q(x))"}
  - id: Q7
    label: "Extra credit: conditional"
    points: 1
    extra_credit: true
    variants:
      A: {prompt: "(∀x P(x)) → (∃x Q(x))"}
      B: {prompt: "(∀x P(x)) → (∃x Q(x))"}
      C: {prompt: "(∀x P(x)) → (∃x Q(x))"}
