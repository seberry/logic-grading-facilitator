<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classwork Setup - Canvas Integration</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            line-height: 1.6;
        }
        h1, h2 { color: #333; }
        h1 { border-bottom: 2px solid #4a90e2; padding-bottom: 10px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        select, input[type="file"] {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }
        .assignments-list {
            max-height: 400px;
            overflow-y: auto;
            border: 1px solid #ddd;
            padding: 10px;
            border-radius: 4px;
        }
        .assignment-item {
            padding: 8px;
            border-bottom: 1px solid #eee;
        }
        .assignment-item:last-child { border-bottom: none; }
        .assignment-item input[type="checkbox"] { margin-right: 10px; }
        .assignment-meta { font-size: 12px; color: #666; margin-left: 25px; }
        .submission-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: bold;
            margin-left: 8px;
            vertical-align: middle;
        }
        .badge-ungraded {
            background-color: #d9534f;
            color: white;
        }
        .badge-graded {
            background-color: #28a745;
            color: white;
        }
        .badge-loading {
            background-color: #6c757d;
            color: white;
        }
        .btn {
            padding: 12px 24px;
            font-size: 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-right: 10px;
        }
        .btn-primary {
            background-color: #4a90e2;
            color: white;
        }
        .btn-secondary {
            background-color: #6c757d;
            color: white;
        }
        .btn:hover { opacity: 0.9; }
        .loading { display: none; color: #666; margin-left: 10px; }
        .error { color: #d9534f; }
        .success { color: #28a745; }
    </style>
</head>
<body>
    <h1>📚 Canvas Classwork Setup</h1>
    
    {% if status == "error" %}
    <div class="error">
        <p><strong>Error:</strong> {{ message }}</p>
    </div>
    {% endif %}
    
    <div class="form-group">
        <label for="course-select">1. Select Canvas Course</label>
        <select id="course-select" onchange="loadAssignments()">
            <option value="">Loading courses...</option>
        </select>
        <span class="loading" id="course-loading">Loading...</span>
    </div>
    
    <div class="form-group">
        <label for="assignments-list">2. Select Assignments to Grade</label>
        <div class="assignments-list" id="assignments-list">
            <p style="color: #666;">Select a course first to load assignments.</p>
        </div>
        <p style="font-size: 12px; color: #666;">
            Assignments are sorted by due date (most recent first). 
            Assignments with no due date appear at the bottom.
        </p>
    </div>
    
    <div class="form-group">
        <button type="button" class="btn btn-primary" onclick="submitSetup()" id="submit-btn">
            Fetch from Canvas & Setup
        </button>
        <a href="/classwork" class="btn btn-secondary">
            Cancel
        </a>
        <span class="loading" id="submit-loading">Processing...</span>
    </div>

    <script>
        let courses = [];
        let assignments = {};
        let submissionCounts = {};
        
        // Load courses on page load
        document.addEventListener('DOMContentLoaded', loadCourses);
        
        async function loadCourses() {
            console.log('[DEBUG] loadCourses called');
            const loadingEl = document.getElementById('course-loading');
            const selectEl = document.getElementById('course-select');
            
            loadingEl.style.display = 'inline';
            selectEl.disabled = true;
            
            try {
                console.log('[DEBUG] Fetching courses...');
                const response = await fetch('/classwork/canvas_courses');
                console.log('[DEBUG] Response received:', response.status);
                const data = await response.json();
                console.log('[DEBUG] Data:', data);
                courses = data.courses || [];
                console.log('[DEBUG] Courses count:', courses.length);
                
                selectEl.innerHTML = '<option value="">-- Select a course --</option>';
                courses.forEach(course => {
                    const option = document.createElement('option');
                    option.value = course.id;
                    option.textContent = `${course.name} (${course.course_code || 'No code'})`;
                    selectEl.appendChild(option);
                });
                
                loadingEl.style.display = courses.length ? 'none' : 'inline';
                selectEl.disabled = false;
            } catch (error) {
                console.error('[ERROR] Failed to load courses:', error);
                selectEl.innerHTML = '<option value="">Failed to load courses</option>';
                loadingEl.style.display = 'none';
                selectEl.disabled = false;
            }
        }
        
        async function loadAssignments() {
            const courseId = document.getElementById('course-select').value;
            const listEl = document.getElementById('assignments-list');
            
            if (!courseId) {
                listEl.innerHTML = '<p style="color: #666;">Select a course first to load assignments.</p>';
                return;
            }
            
            listEl.innerHTML = '<p style="color: #666;">Loading assignments...</p>';
            submissionCounts = {}; // Reset counts
            
            try {
                // Load assignments
                const response = await fetch(`/classwork/canvas_assignments?course_id=${courseId}`);
                const data = await response.json();
                assignments = data.assignments || [];
                
                if (assignments.length === 0) {
                    listEl.innerHTML = '<p style="color: #666;">No assignments found for this course.</p>';
                    return;
                }
                
                // Load submission counts in parallel
                try {
                    const countsResponse = await fetch(`/classwork/canvas_submission_counts?course_id=${courseId}`);
                    const countsData = await countsResponse.json();
                    submissionCounts = countsData.assignment_counts || {};
                } catch (countsError) {
                    console.warn('Failed to load submission counts:', countsError);
                    submissionCounts = {};
                }
                
                // Render assignments with badges
                listEl.innerHTML = '';
                assignments.forEach(assignment => {
                    const dueDate = assignment.due_date 
                        ? new Date(assignment.due_date).toLocaleDateString()
                        : 'No due date';
                    
                    // Get submission counts
                    const counts = submissionCounts[assignment.id] || {submitted: 0, graded: 0, ungraded: 0};
                    const submitted = counts.submitted || 0;
                    const graded = counts.graded || 0;
                    const ungraded = counts.ungraded || 0;
                    
                    // Create badge based on ungraded count
                    let badgeHtml = '';
                    if (submitted > 0) {
                        if (ungraded > 0) {
                            badgeHtml = `<span class="submission-badge badge-ungraded">${ungraded} ungraded</span>`;
                        } else if (graded > 0) {
                            badgeHtml = `<span class="submission-badge badge-graded">✓ Graded</span>`;
                        }
                    }
                    
                    const div = document.createElement('div');
                    div.className = 'assignment-item';
                    
                    // Create checkbox
                    const checkbox = document.createElement('input');
                    checkbox.type = 'checkbox';
                    checkbox.value = assignment.id;
                    checkbox.id = `assignment-${assignment.id}`;
                    div.appendChild(checkbox);
                    
                    // Create label
                    const label = document.createElement('label');
                    label.htmlFor = `assignment-${assignment.id}`;
                    label.innerHTML = `
                        <strong>${assignment.name}</strong> ${badgeHtml}
                        <div class="assignment-meta">
                            Max points: ${assignment.max_points} | Due: ${dueDate} | Submitted: ${submitted} | Graded: ${graded}
                        </div>
                    `;
                    div.appendChild(label);
                    
                    listEl.appendChild(div);
                });
                
            } catch (error) {
                console.error('Failed to load assignments:', error);
                listEl.innerHTML = '<p style="color: #d9534f;">Failed to load assignments. Please try again.</p>';
            }
        }
        
        async function submitSetup() {
            const courseId = document.getElementById('course-select').value;
            const checkboxes = document.querySelectorAll('input[type="checkbox"]:checked');
            const assignmentIds = Array.from(checkboxes).map(cb => parseInt(cb.value));
            
            if (!courseId) {
                alert('Please select a course.');
                return;
            }
            
            if (assignmentIds.length === 0) {
                alert('Please select at least one assignment to grade.');
                return;
            }
            
            const submitBtn = document.getElementById('submit-btn');
            const loadingEl = document.getElementById('submit-loading');
            
            submitBtn.disabled = true;
            loadingEl.style.display = 'inline';
            loadingEl.textContent = 'Downloading submissions from Canvas...';
            
            const formData = new FormData();
            formData.append('course_id', courseId);
            assignmentIds.forEach(aid => formData.append('assignment_ids', aid.toString()));
            formData.append('use_auto_download', 'true');
            
            try {
                const response = await fetch('/classwork/canvas_setup', {
                    method: 'POST',
                    body: formData
                });
                
                if (response.redirected) {
                    window.location.href = response.url;
                } else {
                    alert('Setup complete! Redirecting to review page...');
                    window.location.href = '/classwork/review';
                }
            } catch (error) {
                console.error('Setup failed:', error);
                alert('Setup failed. Please check the error message above and try again.');
                submitBtn.disabled = false;
                loadingEl.style.display = 'none';
            }
        }
    </script>
</body>
</html>
