<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Flashcards Export</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      background: #f3f4f6;
      color: #111827;
    }
    header {
      background: #111827;
      color: #f9fafb;
      padding: 1rem 1.5rem;
    }
    main {
      max-width: 800px;
      margin: 2rem auto;
      padding: 0 1rem;
    }
    .card {
      background: #ffffff;
      border-radius: 0.75rem;
      padding: 1.5rem;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.08);
    }
    .btn {
      display: inline-block;
      margin-top: 1rem;
      background: #2563eb;
      color: #ffffff;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 0.5rem;
      font-size: 0.95rem;
      cursor: pointer;
      text-decoration: none;
    }
    .muted {
      font-size: 0.85rem;
      color: #6b7280;
      margin-top: 0.5rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>Flashcards Export</h1>
  </header>
  <main>
    <div class="card">
      {% if dataset_url %}
        <p>Export ready. Dataset items: {{ dataset_count }}.</p>
        <a class="btn" href="{{ dataset_url }}" target="_blank" rel="noopener">Open dataset.json</a>
      {% else %}
        <p>No dataset export yet.</p>
        <form method="post" action="/flashcards/export">
          <input type="hidden" name="session_id" value="{{ session_id }}">
          <button class="btn" type="submit">Export dataset</button>
        </form>
      {% endif %}
      <div class="muted">Session: {{ session_id }}</div>
    </div>
  </main>
</body>
</html>
