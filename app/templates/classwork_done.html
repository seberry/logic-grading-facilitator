<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Classwork Export Ready</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; margin: 2rem; background: #f8fafc; color: #111827; }
    .card { max-width: 900px; background: #fff; border: 1px solid #e5e7eb; border-radius: 10px; padding: 1rem 1.2rem; }
    h1 { margin-top: 0; }
    button, .btn { display: inline-block; border: 1px solid #2563eb; background: #2563eb; color: #fff; border-radius: 6px; padding: 0.55rem 0.9rem; text-decoration: none; margin-right: 0.4rem; }
    .btn.secondary { border-color: #d1d5db; background: #fff; color: #111827; }
    .muted { color: #6b7280; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Classwork Finalized</h1>
    <p>Assignment <code>{{ assignment_id }}</code> was exported.</p>
    <p>
      <a class="btn" href="/classwork/export/{{ export_id }}/gradebook">Download merged gradebook CSV</a>
      {% if comments_file %}
        <a class="btn" href="/classwork/export/{{ export_id }}/comments">Download comments reupload ZIP</a>
      {% endif %}
    </p>
    {% if not comments_file %}
      <p class="muted">No comments were entered, so no comments ZIP was generated.</p>
    {% endif %}
    <p>
      <a class="btn secondary" href="/classwork/review">Back to review</a>
      <a class="btn secondary" href="/finish">Go to finish page</a>
    </p>
  </div>
</body>
</html>
